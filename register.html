<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <h2 class="text-center my-4 ">Register with Us</h2>
            <div
                class="container border rounded shadow my-3 p-4 col-6"
            >
                <form action="login.html">
                    <div class="mb-3">
                        <label for="" class="form-label">Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder=""
                            pattern="[a-zA-Z]+[\s]+"
                        />
                        <small id="helpId" class="form-text text-body-secondary"
                            >only Alphabets allowed</small
                        >
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Age</label>
                        <input
                            type="number"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder=""
                        />
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder=""
                        />
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">DOB</label>
                        <input
                            type="date"
                            class="form-control"
                            name=""
                            id=""
                            aria-describedby="helpId"
                            placeholder=""
                        />
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Choose file</label>
                        <input
                            type="file"
                            class="form-control"
                            name=""
                            id=""
                            placeholder=""
                            aria-describedby="fileHelpId"
                        />
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">City</label>
                        <select
                            class="form-select form-select-lg"
                            name=""
                            id=""
                        >
                            <option selected>Select one</option>
                            <option value="">New Delhi</option>
                            <option value="">Mumbai</option>
                            <option value="">Goa</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name=""
                            id=""
                            placeholder=""
                        />
                    </div>
                    <div class="form-check my-2">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            value=""
                            id=""
                            required
                        />
                        <label class="form-check-label" for=""> Agree with all Terms</label>
                    </div>
                    <button
                        type="submit"
                        class="btn btn-success text-center"
                    >
                        Submit
                    </button>
                    
                </form>
            </div>
            
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
